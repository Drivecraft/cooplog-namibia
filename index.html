<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'">
<title>CoopLog Namibia – Egg Farm Tracker</title>
<style>
:root{--bg:#FAF9F5;--card:#fff;--ink:#1F2E38;--mute:#5a6770;--line:#d9d5c8;--yolk:#F2B233;--yolk-ink:#3a2a00;--green:#2f6b3a;--red:#a83a29;--shell:#8A5A3B;--amber:#8a5d00}
@media (prefers-color-scheme:dark){:root{--bg:#14201f;--card:#1c2b2a;--ink:#f1efe6;--mute:#a9bbb8;--line:#33494a;--green:#79c487;--red:#ef8f7e;--shell:#d2a07c;--amber:#e8b84a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:780px;margin:0 auto;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:26px;font-weight:800;margin:8px 0 2px;letter-spacing:-.02em}
h2{font-size:18px;margin:26px 0 8px}
.sub{color:var(--mute);margin:0 0 14px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.stat span{color:var(--mute);font-size:13px}
.stat.hero{grid-column:1/-1;background:var(--yolk);border-color:var(--yolk);color:var(--yolk-ink)}
.stat.hero b{font-size:48px}.stat.hero span{color:var(--yolk-ink)}
form,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;min-height:46px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
input[type=checkbox]{width:auto;min-height:0;accent-color:var(--green);width:20px;height:20px}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
[aria-invalid=true]{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row>*,.row3>*{min-width:0}
input[type=date]{max-width:100%;min-width:0}
@media (max-width:360px){.row,.row3{grid-template-columns:1fr}.quick{grid-template-columns:1fr}}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px 16px;min-height:46px;background:var(--ink);color:var(--bg);width:100%;margin-top:14px;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
button.small{width:auto;margin:0;padding:8px 12px;min-height:40px;font-size:14px;background:transparent;color:var(--red);border:1px solid var(--line)}
button.small.plain{color:var(--ink)}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:10px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.item small{color:var(--mute);display:block}
.item>div:first-child{min-width:0;overflow-wrap:anywhere}
.item .r{text-align:right;flex:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:55%}
.empty{color:var(--mute);padding:14px;border:1px dashed var(--line);border-radius:14px;text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:5;gap:2px}
nav button{margin:0;background:transparent;color:var(--mute);padding:10px 12px;flex:1 0 auto;width:auto;font-size:14px;border-radius:10px}
nav button[aria-current="true"]{background:var(--yolk);color:var(--yolk-ink)}
.rem{padding:10px 12px;border-radius:12px;margin:6px 0;border:1px solid var(--line);background:var(--card);font-size:15px;display:flex;justify-content:space-between;gap:10px}
.rem a{color:inherit;font-weight:600;flex:none}
.rem.bad{border-color:var(--red);color:var(--red)}.rem.warn{border-color:var(--amber);color:var(--amber)}.rem.info{color:var(--mute)}
.warn-t{color:var(--red)}.ok-t{color:var(--green)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
td a{color:var(--ink);text-decoration:underline}
th{color:var(--mute);font-weight:600;font-size:12px}tr:last-child td{border:0}
.days{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.chk{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:15px;margin-top:14px}
.tabs-sub{display:flex;gap:8px;flex-wrap:wrap}.tabs-sub button{width:auto}
.hint{font-size:13px;color:var(--mute);margin:6px 0 0}
.banner{padding:12px 14px;border-radius:12px;margin:8px 0;border:1px solid var(--line);background:var(--card)}
.banner.bad{border-color:var(--red);color:var(--red)}.banner.info{border-color:var(--green)}
.banner ul{margin:6px 0 0;padding-left:20px}
.status{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin:2px 0 6px}
.status a{color:inherit}
.ferr{color:var(--red);font-size:14px;margin-top:10px;min-height:0}
.ferr:empty{display:none}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.tag.ok{color:var(--green)}.tag.warn{color:var(--amber)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.quick button{margin:0;padding:12px 6px}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.bars i{display:block;background:var(--shell);border-radius:6px 6px 0 0;min-height:2px}
.bars em{font-style:normal;display:block;color:var(--ink);font-size:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:9;max-width:90vw}
@media print{nav,.status,button,form,.banner,#toast{display:none!important}body{background:#fff;color:#000}}
@media (prefers-reduced-motion:no-preference){button{transition:opacity .15s}}

</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav id="nav" aria-label="Sections"></nav>
<div id="toast" role="status" hidden></div>
<noscript>CoopLog needs JavaScript. Please enable it in your browser.</noscript>
<script>
/* CoopLog Namibia core: data model, validation, stock + finance calculations, storage.
   No DOM access, so it can be unit-tested in Node. All money is N$ (2 decimals). */
var APP_VERSION='2.0.0',SCHEMA=2;
var KEY='cooplog.na.v1',KEYREV='cooplog.na.rev',KEYPREV='cooplog.na.prev',KEYORIG='cooplog.na.v1-original',RPPREFIX='cooplog.na.rp.';
var MAXTXT=200,MAXNUM=1e7,MAXEGGS=1e6,SAFE=9007199254740991;
var COLLS=['flocks','adjust','feedTypes','eggs','moves','feedBuys','feedMoves','sprays','cleans','vendors','sales','payments','credits','expenses','suppliers','trayBuys'];
var ORDER=['flocks','feedTypes','vendors','suppliers','adjust','eggs','moves','feedBuys','feedMoves','sprays','cleans','sales','payments','credits','expenses','trayBuys'];
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var EXPCATS=['Labour','Water & electricity','Transport & fuel','Repairs & equipment','Vet & medicine','Rent','Packaging','Other'];
var METHODS=['Cash','Bank transfer','eWallet','Other','Migrated'];
var _today=null,_u=0;

/* ---------- small helpers ---------- */
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

function setToday(s){_today=s}
function isDate(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;var d=new Date(s+'T12:00:00');return !isNaN(d.getTime())&&iso(d)===s&&s>='2000-01-01'&&s<='2100-12-31'}
function addDays(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}
function diff(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)}
function dow(s){return new Date(s+'T12:00:00').getDay()}
function weekStart(s){return addDays(s,-((dow(s)+6)%7))}
function uid(){_u=(_u+1)%1000;return Date.now()*1000+_u}
function r2(n){return Math.round((n+(n<0?-1e-9:1e-9))*100)/100}
function cents(n){return Math.round(n*100)}
function sumM(a,f){var c=0;a.forEach(function(x){c+=cents(f(x))});return c/100}
function sumN(a,f){var t=0;a.forEach(function(x){t+=f(x)||0});return t}
function byId(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
function byDateId(a,b){return a.date<b.date?-1:a.date>b.date?1:a.id-b.id}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function custKey(n){return String(n).trim().toLowerCase()}
function saleTotal(s){return r2(s.eggs*s.price)}
function VErr(msg,field){this.message=msg;this.field=field||'';this.isV=true}
function fail(msg,field){throw new VErr(msg,field)}
function soft(key,msg,opts){if(opts&&opts.ok&&opts.ok[key])return;var e=new VErr(msg);e.soft=key;throw e}

/* ---------- schema ---------- */
var SPEC={};
SPEC.settings={farm:{t:'txt',max:60,def:'My Egg Farm'},price:{t:'money',min:0.01,def:3.5},tray:{t:'int',min:1,max:360,def:30},clean:{t:'int',min:1,max:365,def:14},trayLow:{t:'int',min:0,max:100000,def:2},feedLow:{t:'num',min:0,def:25},reorderDays:{t:'int',min:1,max:90,def:7},lowRatio:{t:'int',min:10,max:100,def:70},openingEggs:{t:'int',min:0,max:MAXEGGS,def:0},openingDate:{t:'date',opt:1,def:''}};
SPEC.flocks={id:{t:'id'},name:{t:'txt',req:1,max:60},kind:{t:'enum',l:['Flock','Cage'],def:'Flock'},hens:{t:'int',req:1,max:100000},breed:{t:'txt',max:60},start:{t:'date',opt:1},status:{t:'enum',l:['active','closed'],def:'active'},closed:{t:'date',opt:1}};
SPEC.adjust={id:{t:'id'},flock:{t:'ref',c:'flocks'},date:{t:'date'},delta:{t:'int',req:1,min:-100000,max:100000,nz:1},type:{t:'enum',l:['added','death','cull','sold','transfer','correction'],def:'correction'},reason:{t:'txt'},xfer:{t:'int',min:0,max:SAFE,def:0}};
SPEC.feedTypes={id:{t:'id'},name:{t:'txt',req:1,max:60},bagKg:{t:'num',max:1000},note:{t:'txt'},openingKg:{t:'num',max:1e6},openingCost:{t:'money',max:100000},reorderKg:{t:'num',max:1e6}};
SPEC.eggs={id:{t:'id'},date:{t:'date'},flock:{t:'ref',c:'flocks'},eggs:{t:'int',req:1,max:MAXEGGS},broken:{t:'int',max:MAXEGGS},rejected:{t:'int',max:MAXEGGS},grade:{t:'enum',l:['Mixed','Small','Medium','Large','Jumbo'],def:'Mixed'},feedType:{t:'ref',c:'feedTypes',zero:1},feedKg:{t:'num',max:100000}};
SPEC.moves={id:{t:'id'},date:{t:'date'},type:{t:'enum',l:['internal','gift','loss','return','adjust','count']},eggs:{t:'int',req:1,min:-MAXEGGS,max:MAXEGGS,nz:1},note:{t:'txt'},flock:{t:'ref',c:'flocks',zero:1},link:{t:'int',min:0,max:SAFE,def:0}};
SPEC.feedBuys={id:{t:'id'},date:{t:'date'},type:{t:'ref',c:'feedTypes'},bags:{t:'num',req:1,min:0.01,max:100000},bagKg:{t:'num',req:1,min:0.01,max:1000},cost:{t:'money',req:1},where:{t:'txt'}};
SPEC.feedMoves={id:{t:'id'},date:{t:'date'},type:{t:'ref',c:'feedTypes'},kind:{t:'enum',l:['use','waste','adjust']},kg:{t:'num',req:1,min:-100000,max:100000,nz:1},flock:{t:'ref',c:'flocks',zero:1},note:{t:'txt'}};
SPEC.sprays={id:{t:'id'},date:{t:'date'},product:{t:'txt',req:1},kind:{t:'txt'},flock:{t:'ref',c:'flocks',zero:1},cost:{t:'money'},wd:{t:'int',max:365},again:{t:'int',max:365},notes:{t:'txt'},verified:{t:'bool'},source:{t:'txt'}};
SPEC.cleans={id:{t:'id'},flock:{t:'ref',c:'flocks',zero:1},task:{t:'txt',req:1},date:{t:'date'}};
SPEC.vendors={id:{t:'id'},name:{t:'txt',req:1,max:80},place:{t:'txt'},days:{t:'days'},price:{t:'money'},remind:{t:'bool'}};
SPEC.sales={id:{t:'id'},date:{t:'date'},vendor:{t:'txt',req:1,max:80},place:{t:'txt'},eggs:{t:'int',req:1,min:1,max:MAXEGGS},price:{t:'money',req:1,min:0.01,max:1000},note:{t:'txt'}};
SPEC.payments={id:{t:'id'},date:{t:'date'},customer:{t:'txt',req:1,max:80},saleId:{t:'ref',c:'sales',zero:1},amount:{t:'money',req:1,min:0.01},method:{t:'enum',l:METHODS,def:'Cash'},kind:{t:'enum',l:['in','refund'],def:'in'},note:{t:'txt'},migrated:{t:'bool'},link:{t:'int',min:0,max:SAFE,def:0}};
SPEC.credits={id:{t:'id'},date:{t:'date'},customer:{t:'txt',req:1,max:80},saleId:{t:'ref',c:'sales',zero:1},amount:{t:'money',req:1,min:0.01},reason:{t:'txt'},eggs:{t:'int',max:MAXEGGS}};
SPEC.expenses={id:{t:'id'},date:{t:'date'},cat:{t:'enum',l:EXPCATS,def:'Other'},amt:{t:'money',req:1,min:0.01},note:{t:'txt'},method:{t:'enum',l:METHODS,def:'Cash'}};
SPEC.suppliers={id:{t:'id'},name:{t:'txt',req:1,max:80},place:{t:'txt'},note:{t:'txt'}};
SPEC.trayBuys={id:{t:'id'},date:{t:'date'},supplier:{t:'txt',req:1,max:80},qty:{t:'int',req:1,min:1,max:100000},cost:{t:'money',req:1}};
var LABELS={eggs:'Eggs',broken:'Broken eggs',rejected:'Rejected eggs',feedKg:'Feed (kg)',hens:'Number of hens',delta:'Hen change',price:'Price per egg',amount:'Amount',amt:'Amount',cost:'Cost',bags:'Bags',bagKg:'Kg per bag',qty:'Number of trays',kg:'Kilograms',date:'Date',name:'Name',vendor:'Customer',customer:'Customer',product:'Product',wd:'Withdrawal days',task:'Task'};

function dflt(sp){if(sp.def!==undefined)return sp.def;switch(sp.t){case 'txt':return '';case 'int':case 'num':case 'money':return 0;case 'bool':return false;case 'days':return [];case 'date':return sp.opt?'':undefined;case 'ref':return sp.zero?0:undefined;case 'obj':return null}return undefined}
function fchk(v,sp,St){
 if(v===undefined||v===null||(v===''&&sp.t!=='txt'&&sp.t!=='date')||(v===''&&sp.t==='date'&&!sp.opt)){var d=dflt(sp);if(d!==undefined&&!sp.req)return{v:d};return{e:'is required'}}
 switch(sp.t){
 case 'txt':if(typeof v==='number')v=String(v);if(typeof v!=='string')return{e:'must be text'};v=v.replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').trim();if(sp.req&&!v)return{e:'is required'};if(v.length>(sp.max||MAXTXT))return{e:'is too long (max '+(sp.max||MAXTXT)+' characters)'};return{v:v};
 case 'id':case 'int':case 'num':case 'money':
  if(typeof v==='string'){v=v.trim();if(/^-?\d+,\d+$/.test(v))v=v.replace(',','.');if(!/^-?\d+(\.\d+)?$/.test(v))return{e:'must be a number'};v=Number(v)}
  if(typeof v!=='number'||!isFinite(v))return{e:'must be a number'};
  if(sp.t==='id'){if(!Number.isSafeInteger(v)||v<=0)return{e:'is not a valid id'};return{v:v}}
  if(sp.t==='int'&&!Number.isInteger(v))return{e:'must be a whole number'};
  if(sp.t==='money'){if(Math.abs(v*100-Math.round(v*100))>1e-6)return{e:'can have at most 2 decimals'};v=r2(v)}
  var mn=sp.min==null?0:sp.min,mx=sp.max==null?MAXNUM:sp.max;
  if(v<mn)return{e:'must be at least '+mn};if(v>mx)return{e:'is too large (max '+mx+')'};if(sp.nz&&v===0)return{e:'cannot be zero'};return{v:v};
 case 'date':if(v===''&&sp.opt)return{v:''};if(!isDate(v))return{e:'is not a valid date'};return{v:v};
 case 'enum':if(sp.l.indexOf(v)<0)return{e:'must be one of: '+sp.l.join(', ')};return{v:v};
 case 'bool':if(v===true||v==='true')return{v:true};if(v===false||v==='false')return{v:false};return{e:'must be true or false'};
 case 'days':if(!Array.isArray(v))return{e:'must be a list of days'};var o=[];for(var i=0;i<v.length;i++){var n=Number(v[i]);if(!Number.isInteger(n)||n<0||n>6)return{e:'has an invalid day'};if(o.indexOf(n)<0)o.push(n)}return{v:o.sort()};
 case 'ref':
  if(typeof v==='string'&&/^\d+$/.test(v))v=Number(v);
  if(typeof v!=='number'||!Number.isSafeInteger(v))return{e:'is not a valid reference'};
  if(v===0&&sp.zero)return{v:0};if(!St||!byId(St[sp.c]||[],v))return{e:'refers to a record that does not exist'};return{v:v};
 case 'obj':if(v===null)return{v:null};if(typeof v!=='object'||Array.isArray(v))return{e:'must be an object'};if(JSON.stringify(v).length>20000)return{e:'is too large'};return{v:v};
 }
 return{e:'unknown field type'}}
function cleanObj(spec,raw,St){var rec={},errs=[];raw=raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{};
 Object.keys(spec).forEach(function(k){var r=fchk(raw[k],spec[k],St);if(r.e)errs.push({field:k,msg:(LABELS[k]||k)+' '+r.e});else rec[k]=r.v});return{rec:rec,errs:errs}}

/* ---------- state ---------- */
function DEF(){var s={schema:SCHEMA,rev:0,settings:{},audit:[],quarantine:[],meta:{backupRequestedAt:'',backupConfirmedAt:'',backupChecksum:''}};
 Object.keys(SPEC.settings).forEach(function(k){s.settings[k]=SPEC.settings[k].def});COLLS.forEach(function(c){s[c]=[]});return s}
var S=DEF(),readonly=false,loadError='',conflict=false,storageDown=false,unsaved=false,lastSaved='',notes=[];

/* ---------- migration (v1 -> v2) and ingest ---------- */
function checksum(St){var str=JSON.stringify(COLLS.map(function(k){return St[k]}).concat([St.settings])),h1=2166136261,h2=5381,i,c;
 for(i=0;i<str.length;i++){c=str.charCodeAt(i);h1^=c;h1=Math.imul(h1,16777619)>>>0;h2=((h2<<5)+h2+c)>>>0}return h1.toString(16)+'-'+h2.toString(16)+'-'+str.length.toString(16)}
function dataOf(St){var d={schema:SCHEMA,settings:St.settings,audit:St.audit,quarantine:St.quarantine};COLLS.forEach(function(c){d[c]=St[c]});return d}
function makeEnvelope(St){St=St||S;return{app:'cooplog-namibia',schema:SCHEMA,version:APP_VERSION,exportedAt:new Date().toISOString(),checksum:checksum(St),data:dataOf(St)}}
function migrate(o){
 var n=[];
 if(!o||typeof o!=='object'||Array.isArray(o))throw new Error('This is not a CoopLog file.');
 var envChecksum='';
 if(o.app==='cooplog-namibia'){
  if(!o.data||typeof o.data!=='object')throw new Error('The backup file has no data section.');
  if(typeof o.schema==='number'&&o.schema>SCHEMA)throw new Error('This backup was made by a newer version of the app (schema '+o.schema+'). Update the app first.');
  envChecksum=o.checksum||'';o=Object.assign({schema:typeof o.schema==='number'?o.schema:undefined},o.data)}
 var ver=o.schema||1;
 if(typeof ver!=='number'||ver>SCHEMA)throw new Error('Unsupported data version.');
 var r={settings:o.settings||{},audit:Array.isArray(o.audit)?o.audit:[],quarantine:Array.isArray(o.quarantine)?o.quarantine:[],meta:o.meta||{}};
 COLLS.forEach(function(c){if(o[c]!==undefined&&!Array.isArray(o[c]))throw new Error('"'+c+'" in the file is not a list.');r[c]=(o[c]||[]).slice()});
 if(ver<2){
  n.push('Upgraded from version 1 data.');
  var s=r.settings;
  if(s.farm===undefined&&o.settings===undefined)s.farm='My Egg Farm';
  r.flocks=r.flocks.map(function(f){return Object.assign({},f,{status:'active',closed:''})});

/* ---------- backup, restore points ---------- */
function previewImport(text){
 var o;try{o=JSON.parse(text)}catch(e){return{ok:false,fatal:'The file is not valid JSON, so it cannot be a CoopLog backup.',errors:[]}}
 var res;try{res=ingest(o)}catch(e){return{ok:false,fatal:e.message,errors:[]}}
 var st=res.state,counts={};COLLS.forEach(function(c){counts[c]=st[c].length});
 return{ok:res.errors.length===0,errors:res.errors,notes:res.notes,quarantine:res.quarantine,state:st,counts:counts,fatal:''}}
function listRestorePoints(){var k=[];try{for(var i=0;i<localStorage.length;i++){var n=localStorage.key(i);if(n&&n.indexOf(RPPREFIX)===0)k.push(n)}}catch(e){}return k.sort().reverse()}
function createRestorePoint(){
 var key=RPPREFIX+Date.now(),str=JSON.stringify(makeEnvelope(S));
 try{localStorage.setItem(key,str);if(localStorage.getItem(key)!==str)throw 0;listRestorePoints().slice(3).forEach(function(k){localStorage.removeItem(k)});return key}
 catch(e){try{localStorage.removeItem(key)}catch(x){}return ''}}
function replaceState(newSt,note,kind){
 var snap=JSON.stringify(S),rev=S.rev,meta=S.meta;
 newSt.rev=rev;newSt.meta=Object.assign({},newSt.meta,{backupRequestedAt:meta.backupRequestedAt,backupConfirmedAt:meta.backupConfirmedAt,backupChecksum:meta.backupChecksum});
 S=newSt;audit(S,kind,'all',{id:0},null,null,note);
 var r=save();if(r==='fail'){var c=conflict;S=JSON.parse(snap);throw new VErr(c?'Another tab has saved newer data. Reload first. Nothing was changed.':'The browser could not store the new data. Nothing was changed.')}}
function applyImport(pv,partial){
 if(!pv||(!pv.ok&&!partial)||!pv.state)throw new VErr('The file did not pass validation, so it was not imported. Your current data is unchanged.');
 var rp=createRestorePoint();if(!rp)throw new VErr('Could not make a safety copy of your current data, so nothing was replaced. Download a backup first.');
 replaceState(pv.state,'imported '+Object.keys(pv.counts).reduce(function(t,k){return t+pv.counts[k]},0)+' records'+(partial&&pv.errors.length?' ('+pv.errors.length+' problem records quarantined)':''),'import');return rp}
function undoRestore(){var rps=listRestorePoints();if(!rps.length)throw new VErr('No restore point available.');
 var txt;try{txt=localStorage.getItem(rps[0])}catch(e){}
 var pv=previewImport(txt||'');if(!pv.state)throw new VErr('The restore point could not be read.');
 var rp=createRestorePoint();if(!rp)throw new VErr('Could not make a safety copy first.');
 replaceState(pv.state,'restored previous data','restore');try{localStorage.removeItem(rps[0])}catch(e){}}
function verifyBackupText(text){var pv=previewImport(text);if(pv.fatal)return{ok:false,msg:pv.fatal};
 if(!pv.ok)return{ok:false,msg:'The file has '+pv.errors.length+' invalid record(s): '+pv.errors.slice(0,3).join('; ')};
 var o=JSON.parse(text),same=checksum(pv.state)===checksum(S);
 return{ok:true,same:same,msg:same?'This file is a valid, complete copy of your current data.':'This file is valid but does not match your current data (it is older, or data changed since).'}}
function markBackup(confirmed){S.meta.backupRequestedAt=new Date().toISOString();S.meta.backupChecksum=checksum(S);if(confirmed)S.meta.backupConfirmedAt=S.meta.backupRequestedAt;save()}

function doImport(partial){if(!PV)return;if(!confirm('Replace the data in this app with the file?\n\nYour current data is saved to a restore point first.'))return;
 try{applyImport(PV,partial);PV=null;EDIT={k:'',id:0};NOTICE='Backup restored ✓';render(true);flash()}catch(e){errBox(e)}}
function doUndo(){if(!confirm('Go back to the data from before the last restore?'))return;try{undoRestore();NOTICE='Previous data restored ✓';render(true);flash()}catch(e){errBox(e)}}
function verifyFile(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var v=verifyBackupText(String(r.result));VMSG=(v.ok?'✓ ':'✗ ')+v.msg;if(v.ok&&v.same){try{markBackup(true);NOTICE='Backup verified ✓'}catch(e){}}render();flash()};r.readAsText(f)}
function delQ(i){if(!confirm('Delete this quarantined record for good?'))return;try{commit(function(){var x=S.quarantine.splice(i,1)[0];audit(S,'delete','quarantine',{id:0},x,null,'quarantined record deleted')});render()}catch(e){errBox(e)}}
function loadSample(){if(!confirm('Replace your data with sample data?'))return;if(!createRestorePoint()){alert('Could not save a restore point, so nothing was changed.');return}
 try{var res=ingest(sampleRaw());replaceState(res.state,'sample data loaded','import');EDIT={k:'',id:0};render(true)}catch(e){errBox(e)}}
function wipe(){if(!confirm('Erase ALL data in this app? A restore point is saved first.')||!confirm('Really erase everything?'))return;
 if(!createRestorePoint()){alert('Could not save a restore point, so nothing was erased. Download a backup first.');return}
 try{var d=DEF();d.settings=Object.assign({},S.settings);replaceState(d,'all data erased','restore');EDIT={k:'',id:0};render(true)}catch(e){errBox(e)}}

/* ---------- exports (backup honesty: never claim success we cannot see) ---------- */
function dlText(name,text,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)}
function dlRaw(){var r=loadError||'';if(!r)try{r=localStorage.getItem(KEY)||''}catch(e){}dlText('cooplog-raw-data-'+today()+'.txt',r||'(nothing stored)','text/plain')}
function exportBackup(){
 var txt=JSON.stringify(makeEnvelope(S),null,1),name='cooplog-backup-'+today()+'.json';
 if(window.showSaveFilePicker){
  window.showSaveFilePicker({suggestedName:name,types:[{description:'CoopLog backup',accept:{'application/json':['.json']}}]}).then(function(h){return h.createWritable().then(function(w){return w.write(txt).then(function(){return w.close()})}).then(function(){markBackup(true);NOTICE='Backup saved to '+h.name+' ✓';render();flash()})})
  .catch(function(e){if(e&&e.name==='AbortError'){NOTICE='Backup cancelled';flash();return}alert('The backup could not be written to the file: '+(e&&e.message||e)+'\n\nNo backup was made.')});return}
 dlText(name,txt,'application/json');markBackup(false);render();
 alert('Backup download started. It is NOT confirmed until you see the file in your Downloads folder.\n\nTo confirm it, use "Verify a backup file" and choose that file.')}
function csvCell(v){v=v==null?'':v;if(typeof v==='number')return String(v);v=String(v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csvOut(name,head,rows){dlText('cooplog-'+name+'-'+today()+'.csv','﻿'+[head].concat(rows).map(function(r){return r.map(csvCell).join(',')}).join('\r\n'),'text/csv')}
function exportCSV(w){
 if(w==='sales'){var st=saleStatus();csvOut('sales',['Date','Day','Customer','Place','Eggs','Price per egg N$','Total N$','Paid N$','Due N$','Note'],S.sales.slice().sort(byDateId).reverse().map(function(s){var x=st[s.id]||{paid:0,due:0};return [s.date,DAYS[dow(s.date)],s.vendor,s.place,s.eggs,s.price,saleTotal(s),x.paid,x.due,s.note]}))}
 else if(w==='eggs')csvOut('eggs',['Date','Flock/cage','Collected','Broken','Rejected','Saleable','Grade','Hens that day','Eggs per hen','Feed','Feed kg'],S.eggs.slice().sort(byDateId).reverse().map(function(e){var f=byId(S.flocks,e.flock),h=f?henAt(f,e.date):0;return [e.date,fname(e.flock),e.eggs,e.broken,e.rejected,e.eggs-e.broken-e.rejected,e.grade,h,h?Math.round(e.eggs/h*100)/100:'',ftname(e.feedType),e.feedKg]}));
 else csvOut('money',['Date','Type','Who / what','Method / category','N$','Note'],S.payments.map(function(p){return [p.date,p.kind==='in'?'Payment in':'Refund paid',p.customer,p.method,p.kind==='in'?p.amount:-p.amount,p.note]}).concat(S.expenses.map(function(x){return [x.date,'Expense',x.cat,x.method,x.amt,x.note]})).sort(function(a,b){return a[0]<b[0]?1:-1}))}
function exportRows(){var q=HF.q.trim().toLowerCase(),rows=transactions().filter(function(r){return(!HF.kind||r.kind===HF.kind)&&(!isDate(HF.from)||r.date>=HF.from)&&(!isDate(HF.to)||r.date<=HF.to)&&(!q||(r.title+' '+r.detail+' '+r.date).toLowerCase().indexOf(q)>=0)});
 csvOut('records',['Date','Type','Details','Note','N$','Quantity'],rows.map(function(r){return [r.date,r.kind,r.title,r.detail,r.amount==null?'':r.amount,r.qty==null?'':r.qty]}))}
function exportStatement(){var names=Object.keys(customers()).map(function(k){return customers()[k].name}),c=STM.cust&&names.indexOf(STM.cust)>=0?STM.cust:names[0];if(!c)return;
 var r=statement(c,isDate(STM.from)?STM.from:'',isDate(STM.to)?STM.to:'');csvOut('statement-'+c.replace(/[^a-z0-9]+/gi,'-'),['Date','Details','Charged N$','Paid or credit N$','Balance N$'],[['','Balance brought forward','','',r.opening]].concat(r.rows.map(function(x){return [x.date,x.desc,x.debit||'',x.credit||'',x.balance]})).concat([['','Balance owed','','',r.closing]]))}
function askNotify(){try{Notification.requestPermission().then(function(p){alert(p==='granted'?'Alerts allowed.':'Alerts not allowed in this browser.')})}catch(e){alert('This browser does not support pop-up alerts.')}}
function notifyOnOpen(){try{if(!window.Notification||Notification.permission!=='granted')return;var k='cooplog.notified',t=today();if(localStorage.getItem(k)===t)return;var r=alerts().filter(function(x){return x.lvl!=='info'});if(!r.length)return;localStorage.setItem(k,t);new Notification(S.settings.farm+': '+r.length+' reminder'+(r.length>1?'s':''),{body:r.slice(0,3).map(function(x){return x.text}).join('\n')})}catch(e){}}

/* ---------- start ---------- */
window.addEventListener('storage',function(e){if(e.key===KEYREV&&String(S.rev)!==String(parseInt(e.newValue,10)||0)){conflict=true;render()}});
window.addEventListener('beforeunload',function(e){if(unsaved||(storageDown&&S.eggs.length+S.sales.length>0)){e.preventDefault();e.returnValue=''}});
loadState();render();notifyOnOpen();
