<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>CoopLog Namibia – Egg Farm Tracker</title>
<style>
:root{--bg:#FAF9F5;--card:#fff;--ink:#1F2E38;--mute:#66737c;--line:#e3e0d6;--yolk:#F2B233;--yolk-ink:#3a2a00;--green:#3F7A4A;--red:#B3412F;--shell:#8A5A3B;--amber:#9a6a00}
@media (prefers-color-scheme:dark){:root{--bg:#14201f;--card:#1c2b2a;--ink:#f1efe6;--mute:#9db0ad;--line:#2b3f3d;--green:#79c487;--red:#ef8f7e;--shell:#d2a07c;--amber:#e8b84a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-top:env(safe-area-inset-top,0)}
main{max-width:760px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:26px;font-weight:800;margin:8px 0 2px;letter-spacing:-.02em}
h2{font-size:18px;margin:24px 0 8px}
.sub{color:var(--mute);margin:0 0 14px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.stat span{color:var(--mute);font-size:13px}
.stat.hero{grid-column:1/-1;background:var(--yolk);border-color:var(--yolk);color:var(--yolk-ink)}
.stat.hero b{font-size:48px}.stat.hero span{color:var(--yolk-ink);opacity:.85}
form,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--yolk);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px 16px;background:var(--ink);color:var(--bg);width:100%;margin-top:14px;cursor:pointer}
button.small{width:auto;margin:0;padding:6px 10px;font-size:13px;background:transparent;color:var(--red);border:1px solid var(--line)}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:10px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.item small{color:var(--mute);display:block}
.item>div:first-child{min-width:0;overflow-wrap:anywhere}
.item .r{text-align:right;flex:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.empty{color:var(--mute);padding:14px;border:1px dashed var(--line);border-radius:14px;text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0));z-index:5;gap:2px}
nav button{margin:0;background:transparent;color:var(--mute);padding:10px 12px;flex:1 0 auto;width:auto;font-size:14px;border-radius:10px}
nav button[aria-current="true"]{background:var(--yolk);color:var(--yolk-ink)}
.rem{padding:10px 12px;border-radius:12px;margin:6px 0;border:1px solid var(--line);background:var(--card);font-size:15px}
.rem.bad{border-color:var(--red);color:var(--red)}.rem.warn{border-color:var(--amber);color:var(--amber)}.rem.info{color:var(--mute)}
.warn-t{color:var(--red)}.ok-t{color:var(--green)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600;font-size:12px}tr:last-child td{border:0}
.days{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.days label{display:flex;align-items:center;gap:5px;margin:0;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.days input{width:auto;padding:0}
.chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px}
.chk input{width:auto}
.tabs-sub{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.tabs-sub button{margin:0;width:auto;padding:8px 12px;font-size:14px}
.hint{font-size:13px;color:var(--mute);margin:6px 0 0}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" aria-label="Sections"></nav>
<script>
/* ===== CoopLog Namibia – everything is stored in this browser (localStorage). All money is N$. ===== */
var KEY='cooplog.na.v1';
function DEF(){return{settings:{farm:'My Egg Farm',price:3.5,tray:30,clean:14,trayLow:2,feedLow:25},flocks:[],adjust:[],feedTypes:[],eggs:[],feedBuys:[],sprays:[],cleans:[],vendors:[],sales:[],suppliers:[],trayBuys:[]}}
var S=DEF(),tab='home',rp=30;
function adopt(o){var d=DEF();S=Object.assign(d,o||{});S.settings=Object.assign(DEF().settings,(o&&o.settings)||{})}
try{var raw=localStorage.getItem(KEY);if(raw)adopt(JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Could not save to this browser. Use Setup > Download backup regularly.')}}

/* ---- helpers ---- */
var $=function(id){return document.getElementById(id)};
var N=function(id){return parseFloat($(id).value)||0};
var V=function(id){return $(id).value.trim()};
var uid=function(){return Date.now()*1000+Math.floor(Math.random()*1000)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return iso(new Date())}
function addDays(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}
function diff(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)}
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function dow(s){return new Date(s+'T12:00:00').getDay()}
function nice(s){return new Date(s+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
function nd(n){return (n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})}
function money(n){return 'N$ '+nd(n)}
function r1(n){return (Math.round(n*10)/10).toString()}
function sumBy(a,k){return a.reduce(function(t,x){return t+(x[k]||0)},0)}
function byId(a,id){return a.filter(function(x){return x.id===id})[0]}
function sortD(a,b){return b.date<a.date?-1:b.date>a.date?1:b.id-a.id}
function flockName(id){if(!id)return 'All flocks / cages';var f=byId(S.flocks,id);return f?f.name:'(removed)'}
function feedName(id){var t=byId(S.feedTypes,id);return t?t.name:'Unspecified'}
function henAt(f,date){return Math.max(0,f.hens+S.adjust.filter(function(a){return a.flock===f.id&&a.date<=date}).reduce(function(t,a){return t+a.delta},0))}
function hensNow(f){return henAt(f,'9999-12-31')}
function lastClean(fid){var d=S.cleans.filter(function(c){return c.flock===0||c.flock===fid}).map(function(c){return c.date}).sort().pop();return d||''}
function from(){return rp?addDays(today(),-(rp-1)):''}
function opts(list,val){return list.map(function(x){return '<option value="'+esc(x[0])+'"'+(String(x[0])===String(val)?' selected':'')+'>'+esc(x[1])+'</option>'}).join('')}
function flockOpts(all){var l=S.flocks.map(function(f){return [f.id,f.name+' ('+f.kind+')']});if(all)l.unshift([0,'All flocks / cages']);return l}
function inp(id,label,o){o=o||{};return '<label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+(o.type||'text')+'" '+(o.attr||'')+' value="'+esc(o.val==null?'':o.val)+'"'+(o.list?' list="'+o.list+'"':'')+'>'}
function sel(id,label,list,val,extra){return '<label for="'+id+'">'+label+'</label><select id="'+id+'" '+(extra||'')+'>'+opts(list,val)+'</select>'}
function item(t,s,r,k,id){return '<div class="item"><div><b>'+t+'</b><small>'+s+'</small></div><div class="r">'+(r||'')+(k?'<button class="small" onclick="del(\''+k+'\','+id+')">Delete</button>':'')+'</div></div>'}
function tbl(h,rows){return '<div class="tw"><table><thead><tr>'+h.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
function none(t){return '<div class="empty">'+t+'</div>'}
function needFlock(){return '<div class="empty">Add a flock or cage first.<button onclick="go(\'flocks\')">Add a flock / cage</button></div>'}
function places(){var p={};S.vendors.forEach(function(v){if(v.place)p[v.place]=1});S.sales.forEach(function(v){if(v.place)p[v.place]=1});S.feedBuys.forEach(function(v){if(v.where)p[v.where]=1});S.suppliers.forEach(function(v){if(v.place)p[v.place]=1});return '<datalist id="places">'+Object.keys(p).map(function(x){return '<option value="'+esc(x)+'">'}).join('')+'</datalist>'}
function del(k,id){if(!confirm('Delete this record?'))return;S[k]=S[k].filter(function(x){return x.id!==id});save();render()}
function go(t){tab=t;render(true)}

/* ---- calculations ---- */
function fin(fromD){
 var ok=function(d){return !fromD||d>=fromD};
 var sales=S.sales.filter(function(s){return ok(s.date)}),eg=S.eggs.filter(function(e){return ok(e.date)});
 var inc=sales.reduce(function(a,s){return a+s.eggs*s.price},0);
 var feed=sumBy(S.feedBuys.filter(function(x){return ok(x.date)}),'cost'),spray=sumBy(S.sprays.filter(function(x){return ok(x.date)}),'cost'),tray=sumBy(S.trayBuys.filter(function(x){return ok(x.date)}),'cost');
 var laid=sumBy(eg,'eggs'),broken=sumBy(eg,'broken'),sold=sumBy(sales,'eggs'),exp=feed+spray+tray;
 return{inc:inc,feed:feed,spray:spray,tray:tray,exp:exp,profit:inc-exp,laid:laid,broken:broken,sold:sold,sales:sales,eg:eg,costEgg:laid-broken>0?exp/(laid-broken):0,avgPrice:sold?inc/sold:0}
}
function perHen(entries){ // sum of eggs/hens on each day = eggs per hen
 var t=0;entries.forEach(function(e){var f=byId(S.flocks,e.flock);var h=f?henAt(f,e.date):0;if(h)t+=e.eggs/h});return t}
function trayStock(){return sumBy(S.trayBuys,'qty')-sumBy(S.sales,'eggs')/S.settings.tray}
function feedStock(tid){
 var bought=S.feedBuys.filter(function(b){return b.type===tid}).reduce(function(t,b){return t+b.bags*b.bagKg},0);
 var used=sumBy(S.eggs.filter(function(e){return e.feedType===tid}),'feedKg');return{bought:bought,used:used,left:bought-used}}
function holds(){var t=today();return S.sprays.filter(function(s){return s.wd>0&&addDays(s.date,s.wd)>=t}).map(function(s){return s.product+' ('+flockName(s.flock)+') until '+addDays(s.date,s.wd)})}
function cheapestTray(){var best=null;S.trayBuys.forEach(function(b){if(!b.qty)return;var p=b.cost/b.qty;if(!best||p<best.p)best={p:p,s:b.supplier}});return best}

function reminders(){
 var t=today(),o=[];
 S.flocks.forEach(function(f){var l=lastClean(f.id),ev=S.settings.clean;
  if(!l)o.push(['bad',esc(f.name)+': no cleaning logged yet']);
  else{var due=diff(l,t)-ev;
   if(due>0)o.push(['bad','Cleaning overdue: '+esc(f.name)+' ('+due+' day'+(due>1?'s':'')+' late, last cleaned '+l+')']);
   else if(due===0)o.push(['bad','Clean today: '+esc(f.name)]);
   else if(due>=-2)o.push(['warn','Cleaning due in '+(-due)+' day'+(due<-1?'s':'')+': '+esc(f.name)])}});
 S.sprays.forEach(function(s){
  if(s.wd>0&&addDays(s.date,s.wd)>=t)o.push(['bad','Do NOT sell eggs from '+esc(flockName(s.flock))+' until '+addDays(s.date,s.wd)+' ('+esc(s.product)+' withdrawal)']);
  if(s.again>0){var nx=addDays(s.date,s.again);var later=S.sprays.some(function(x){return x.id!==s.id&&x.product===s.product&&x.flock===s.flock&&x.date>s.date});
   if(!later&&nx<=addDays(t,3))o.push([nx<t?'bad':'warn',(nx<t?'Spray overdue: ':'Spray due '+nx+': ')+esc(s.product)+' – '+esc(flockName(s.flock))])}});
 S.vendors.filter(function(v){return v.remind&&v.days&&v.days.length}).forEach(function(v){
  for(var i=0;i<7;i++){var d=addDays(t,i);if(v.days.indexOf(dow(d))>-1){
   o.push([i===0?'warn':'info',(i===0?'TODAY: ':i===1?'Tomorrow: ':DAYS[dow(d)]+': ')+'sell/deliver eggs to '+esc(v.name)+(v.place?' ('+esc(v.place)+')':'')]);break}}});
 if(S.trayBuys.length&&trayStock()<S.settings.trayLow){var c=cheapestTray();o.push(['warn','Egg trays low ('+r1(Math.max(0,trayStock()))+' left). Buy more'+(c?' – cheapest so far: '+esc(c.s)+' at '+money(c.p)+'/tray':'')])}
 S.feedTypes.forEach(function(ft){var st=feedStock(ft.id);if(st.bought>0&&st.left<S.settings.feedLow)o.push(['warn','Feed running low: '+esc(ft.name)+' ('+r1(Math.max(0,st.left))+' kg left)'])});
 var rank={bad:0,warn:1,info:2};return o.sort(function(a,b){return rank[a[0]]-rank[b[0]]})}

/* ---- render ---- */
var TABS=[['home','Home'],['log','Eggs'],['sales','Sales'],['feed','Feed'],['trays','Trays'],['care','Care'],['flocks','Flocks'],['reports','Reports'],['setup','Setup']];
function render(top){
 $('nav').innerHTML=TABS.map(function(t){return '<button onclick="go(\''+t[0]+'\')" aria-current="'+(tab===t[0])+'">'+t[1]+'</button>'}).join('');
 var y=window.scrollY;
 $('app').innerHTML=({home:home,log:logView,sales:salesView,feed:feedView,trays:traysView,care:careView,flocks:flocksView,reports:reportsView,setup:setupView})[tab]();
 window.scrollTo(0,top?0:y);
 var cur=document.querySelector('nav [aria-current="true"]');if(cur&&cur.scrollIntoView)try{cur.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}
}

function home(){
 var t=today(),te=sumBy(S.eggs.filter(function(e){return e.date===t}),'eggs');
 var d30=addDays(t,-29),f=fin(d30),hens=S.flocks.reduce(function(a,x){return a+hensNow(x)},0);
 var w7=S.eggs.filter(function(e){return e.date>=addDays(t,-6)});
 var rate=0,hd=0;w7.forEach(function(e){var fl=byId(S.flocks,e.flock);if(fl)hd+=henAt(fl,e.date)});if(hd)rate=sumBy(w7,'eggs')/hd*100;
 var stock=sumBy(S.eggs,'eggs')-sumBy(S.eggs,'broken')-sumBy(S.sales,'eggs');
 var rem=reminders();
 var remH=rem.length?rem.map(function(r){return '<div class="rem '+r[0]+'">'+r[1]+'</div>'}).join(''):none('No reminders. All up to date.');
 var wk=[];for(var i=6;i>=0;i--){var d=addDays(t,-i);wk.push([d,sumBy(S.eggs.filter(function(e){return e.date===d}),'eggs')])}
 var max=Math.max.apply(null,wk.map(function(w){return w[1]}).concat([1]));
 var bars='<div style="display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:6px">'+wk.map(function(w){return '<div style="flex:1;text-align:center;font-size:11px;color:var(--mute)"><div style="color:var(--ink);font-size:12px">'+w[1]+'</div><div style="background:var(--shell);border-radius:6px 6px 0 0;min-height:2px;height:'+Math.round(w[1]/max*80)+'px"></div>'+DAYS[dow(w[0])].slice(0,3)+'</div>'}).join('')+'</div>';
 return '<h1>'+esc(S.settings.farm)+'</h1><p class="sub">'+nice(t)+' · all money in N$</p>'+
 '<div class="big"><div class="stat hero"><b>'+te+'</b><span>eggs collected today</span></div>'+
 '<div class="stat"><b>'+r1(rate)+'%</b><span>7-day lay rate</span></div>'+
 '<div class="stat"><b>'+hens+'</b><span>hens now</span></div>'+
 '<div class="stat"><b>'+stock+'</b><span>eggs in hand (laid − broken − sold)</span></div>'+
 '<div class="stat"><b>'+money(S.settings.price)+'</b><span>price per egg ('+money(S.settings.price*S.settings.tray)+' / tray of '+S.settings.tray+')</span></div>'+
 '<div class="stat"><b>'+money(f.inc)+'</b><span>sales, 30 days</span></div>'+
 '<div class="stat"><b>'+money(f.exp)+'</b><span>costs, 30 days</span></div>'+
 '<div class="stat" style="grid-column:1/-1"><b class="'+(f.profit<0?'warn-t':'ok-t')+'">'+money(f.profit)+'</b><span>profit, 30 days'+(f.costEgg?' · cost per egg '+money(f.costEgg):'')+'</span></div></div>'+
 '<h2>Reminders</h2>'+remH+'<h2>Last 7 days</h2><div class="panel">'+bars+'</div>'+
 (S.flocks.length?'':'<h2>Get started</h2>'+needFlock());
}

/* ---- eggs ---- */
function logView(){
 if(!S.flocks.length)return '<h1>Eggs</h1>'+needFlock();
 var ft=[[0,'— none —']].concat(S.feedTypes.map(function(x){return [x.id,x.name]}));
 var days='';for(var i=0;i<14;i++){var d=addDays(today(),-i),L=S.eggs.filter(function(e){return e.date===d});
  var e=sumBy(L,'eggs'),b=sumBy(L,'broken'),ph=perHen(L);
  days+=item(nice(d)+(i===0?' (today)':''),L.length?b+' broken · '+(e-b)+' good · '+nd(ph).replace(/\.?0+$/,'')+' eggs/hen':'No entry',L.length?'<b>'+e+'</b>':'<span class="warn-t">–</span>')}
 var recent=S.eggs.slice().sort(sortD).slice(0,15).map(function(e){var f=byId(S.flocks,e.flock),h=f?henAt(f,e.date):0;
  return item(e.eggs+' eggs · '+esc(f?f.name:'(removed)'),e.date+' · '+e.broken+' broken · '+(h?nd(e.eggs/h)+' per hen ('+h+' hens)':'')+' · feed '+e.feedKg+' kg '+esc(e.feedType?feedName(e.feedType):''),'','eggs',e.id)}).join('');
 return '<h1>Egg & feed log</h1><p class="sub">One entry per flock/cage per day. Saving the same day again replaces it.</p><form onsubmit="addEgg(event)">'+
 sel('ef','Flock / cage',flockOpts())+inp('ed','Date',{type:'date',val:today()})+
 '<div class="row">'+inp('ee','Eggs collected',{type:'number',attr:'inputmode="numeric" min="0" required'})+inp('eb','Broken / cracked',{type:'number',attr:'inputmode="numeric" min="0"',val:0})+'</div>'+
 '<div class="row">'+sel('eft','Feed given (type)',ft,0)+inp('efk','Feed used (kg)',{type:'number',attr:'inputmode="decimal" min="0" step="0.1"',val:0})+'</div>'+
 '<button type="submit">Save entry</button></form>'+
 '<h2>Eggs per hen, last 30 days</h2>'+perFlockTable(addDays(today(),-29))+
 '<h2>Daily totals</h2><div class="panel">'+days+'</div><h2>Recent entries</h2><div class="panel">'+(recent||none('No entries yet.'))+'</div>';
}
function addEgg(e){e.preventDefault();var fl=parseInt(V('ef')),d=V('ed')||today();
 S.eggs=S.eggs.filter(function(x){return !(x.flock===fl&&x.date===d)});
 S.eggs.push({id:uid(),date:d,flock:fl,eggs:N('ee'),broken:N('eb'),feedType:parseInt(V('eft'))||0,feedKg:N('efk')});save();render()}
function perFlockTable(fromD){
 if(!S.flocks.length)return none('No flocks yet.');
 var rows=S.flocks.map(function(f){var L=S.eggs.filter(function(e){return e.flock===f.id&&(!fromD||e.date>=fromD)});
  var eggs=sumBy(L,'eggs'),hd=L.reduce(function(t,e){return t+henAt(f,e.date)},0),feed=sumBy(L,'feedKg'),h=hensNow(f);
  return [esc(f.name)+' <small>('+f.kind+')</small>',h,eggs,nd(perHen(L)),hd?r1(eggs/hd*100)+'%':'–',h?nd(eggs/(L.length||1)/h)+'':'–',r1(feed)]});
 return tbl(['Flock / cage','Hens now','Eggs','Eggs per hen','Lay rate','Eggs/hen/day','Feed kg'],rows)}

/* ---- sales & vendors ---- */
function salesView(){
 var vopt=[[0,'Other / walk-in customer']].concat(S.vendors.map(function(v){return [v.id,v.name+(v.place?' – '+v.place:'')]}));
 var recent=S.sales.slice().sort(sortD).slice(0,20).map(function(s){return item(esc(s.vendor)+' · '+s.eggs+' eggs',DAYS[dow(s.date)]+' '+s.date+(s.place?' · '+esc(s.place):'')+' · '+money(s.price)+'/egg'+(s.note?' · '+esc(s.note):''),'<b>'+money(s.eggs*s.price)+'</b>','sales',s.id)}).join('');
 var vl=S.vendors.map(function(v){return item(esc(v.name),(v.place?esc(v.place)+' · ':'')+(v.days.length?v.days.map(function(d){return DAYS[d].slice(0,3)}).join(', '):'no fixed days')+(v.price?' · '+money(v.price)+'/egg':'')+(v.remind?' · reminder ON':''),'','vendors',v.id)}).join('');
